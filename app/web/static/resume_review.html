<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!--BASE_HREF-->
  <link rel="stylesheet" href="static/app.css?v=20261010">
  <title>字段校对 · 卓品智能招聘助手</title>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand">卓品智能招聘助手</span>
      <span class="brand-sub">HR 工作台 · 字段校对</span>
    </div>
  </header>
  <main class="page">
    <h1 class="page-title">字段校对</h1>
    <p class="notice"><strong>右侧字段由 AI 自动抽取，点击字段可在左侧原文中看到依据；未经确认前仅供参考。</strong></p>
    <div style="display:flex; gap:16px; flex-wrap:wrap">
      <div style="flex:1 1 320px"><div class="card" style="margin:0"><div id="raw-text">加载中…</div></div></div>
      <div style="flex:1 1 320px"><div class="card" style="margin:0"><div id="fields-panel">加载中…</div></div></div>
    </div>
    <p id="error" style="color:red"></p>
  </main>

  <script>
    // 内部字段标识 → 中文名（界面上不出现英文 snake_case；2026-10-07 1001G 审计）。
    const FIELD_LABELS = {
      name: "姓名",
      years_of_experience: "工作年限",
      skills: "技能列表",
      companies: "公司经历",
      education: "教育（最高学历与院校）",
      expected_city: "期望城市",
    };

    function resumeIdFromPath() {
      const m = window.location.pathname.match(/\/resumes\/([^/]+)\/review\/?$/);
      return m ? m[1] : null;
    }

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    const resumeId = resumeIdFromPath();
    let rawText = "";
    let parsedFields = {};

    // start/end 是后端 app/parsing/spans.py 按 Python 码点（code point）计算的
    // 全文偏移。JS 字符串原生按 UTF-16 code unit 索引——当 rawText 里 span 之前
    // 出现代理对字符（罕见 CJK 扩展 B 区汉字、emoji）时，两种索引会分道扬镳，
    // 直接 slice 会静默高亮错的子串（违反"不许出现没有真实依据的高亮"这条证据
    // 完整性约束）。用 Array.from 把字符串拆成码点数组再切片，与后端语义对齐。
    function codePoints(text) {
      return Array.from(text);
    }

    // 纯函数，不碰 DOM——便于脱离浏览器单独测试这段切片/校验逻辑。
    function buildRawTextHtml(text, highlightSpans) {
      const chars = codePoints(text);
      const spans = (highlightSpans || []).slice().sort((a, b) => a.start - b.start);
      let html = "";
      let cursor = 0;
      for (const span of spans) {
        if (span.start < cursor) continue; // 忽略与前一个 span 重叠的部分，MVP 不处理重叠
        html += escapeHtml(chars.slice(cursor, span.start).join(""));
        const sliced = chars.slice(span.start, span.end).join("");
        // 渲染前必须核对切出来的子串与持久化的 span.quote 逐字相等——不相等
        // 说明偏移与原文对不上，不能当作真实依据渲染成 <mark>，否则就是在
        // 展示一个编造出来的高亮。降级成纯文本提示，不让这一个 span 的问题
        // 挡住其它 span 正常渲染。
        if (sliced === span.quote) {
          html += `<mark>${escapeHtml(sliced)}</mark>`;
        } else {
          html += escapeHtml(sliced) + escapeHtml("［回指偏移与原文不一致］");
        }
        cursor = span.end;
      }
      html += escapeHtml(chars.slice(cursor).join(""));
      return html;
    }

    function renderRawText(highlightSpans) {
      document.getElementById("raw-text").innerHTML = buildRawTextHtml(rawText, highlightSpans);
    }

    function selectField(fieldName) {
      document.querySelectorAll(".field-row").forEach((el) => el.classList.remove("selected"));
      const row = document.getElementById(`field-row-${fieldName}`);
      if (row) row.classList.add("selected");
      const field = parsedFields[fieldName] || {};
      renderRawText(field.spans || []);
    }

    async function submitReview(fieldName, humanValue) {
      const resp = await fetch(`api/resumes/${resumeId}/fields/${fieldName}/review`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ human_value: humanValue }),
      });
      if (resp.ok) {
        await loadParsed();
      } else {
        document.getElementById("error").textContent = "提交失败：该字段可能没有待校对记录";
      }
    }

    function fieldDisplayValue(field) {
      if (field.not_mentioned) return "未提及";
      const v = field.value;
      if (v === null || v === undefined) return "未提及";
      if (Array.isArray(v)) return v.length ? v.join("、") : "未提及";
      if (typeof v === "object") return [v.degree, v.school].filter(Boolean).join(" ") || "未提及";
      return String(v);
    }

    function renderFields() {
      const panel = document.getElementById("fields-panel");
      panel.innerHTML = "";
      for (const [fieldName, field] of Object.entries(parsedFields)) {
        const fieldLabel = FIELD_LABELS[fieldName] || fieldName;
        const row = document.createElement("div");
        row.className = "field-row" + (field.review_pending ? " pending" : "");
        row.id = `field-row-${fieldName}`;
        // 键盘可达（09-UI-Design.md §6）：Enter/Space 与鼠标点击等价。
        row.tabIndex = 0;
        row.setAttribute("role", "button");
        row.addEventListener("click", () => selectField(fieldName));
        row.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            selectField(fieldName);
          }
        });

        const title = document.createElement("div");
        title.textContent = `${fieldLabel}：${fieldDisplayValue(field)}`;
        const meta = document.createElement("span");
        meta.className = "field-meta";
        meta.textContent = `AI 置信度 ${field.confidence}`;
        title.appendChild(meta);
        row.appendChild(title);

        if (field.review_pending) {
          const badge = document.createElement("span");
          badge.className = "badge badge-ai";
          badge.textContent = "待校对";
          row.appendChild(badge);
        }

        const controls = document.createElement("div");
        controls.className = "field-controls";
        const confirmBtn = document.createElement("button");
        confirmBtn.className = "btn btn-sm";
        confirmBtn.textContent = "确认";
        confirmBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          submitReview(fieldName, fieldDisplayValue(field));
        });
        controls.appendChild(confirmBtn);

        const editInput = document.createElement("input");
        editInput.type = "text";
        editInput.placeholder = "改为…";
        editInput.addEventListener("click", (e) => e.stopPropagation());
        controls.appendChild(editInput);

        const editBtn = document.createElement("button");
        editBtn.className = "btn btn-sm btn-ghost";
        editBtn.textContent = "提交修改";
        editBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          if (editInput.value.trim()) submitReview(fieldName, editInput.value.trim());
        });
        controls.appendChild(editBtn);
        row.appendChild(controls);

        panel.appendChild(row);
      }
    }

    // 会话过期时统一跳登录页（与 resume_list.html 的既有行为一致）。返回
    // true 表示已跳转，调用方必须立刻停手，不能再往下渲染 401 响应体——
    // 401 的 body 不是真实数据，渲染出来是"看起来没登录但界面正常"的假象。
    function redirectIfUnauthorized(resp) {
      if (resp.status === 401) {
        window.location.href = "login";
        return true;
      }
      return false;
    }

    async function loadRawText() {
      const resp = await fetch(`api/resumes/${resumeId}/text`);
      if (redirectIfUnauthorized(resp)) return false;
      const body = await resp.json();
      rawText = body.raw_text || "";
      return true;
    }

    async function loadParsed() {
      const resp = await fetch(`api/resumes/${resumeId}/parsed`);
      if (redirectIfUnauthorized(resp)) return false;
      const body = await resp.json();
      const parsed = body.parsed_json || {};
      parsedFields = {};
      for (const [name, field] of Object.entries(parsed)) {
        // 待校对状态来自后端只读旁路键 field_review_status（1001H）：本页的数据源
        // 只有 parsed_json 时前端拿不到队列状态，黄底/徽标就永远不显示。
        parsedFields[name] = {
          ...field,
          review_pending: body.field_review_status?.[name] === "pending",
        };
      }
      renderFields();
      renderRawText([]);
      return true;
    }

    async function init() {
      const rawOk = await loadRawText();
      if (!rawOk) return; // 已跳登录页，不再继续加载/渲染
      await loadParsed();
    }

    init();
  </script>
</body>
</html>
