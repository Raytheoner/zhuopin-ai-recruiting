<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--BASE_HREF-->
  <link rel="stylesheet" href="static/app.css?v=20261010">
  <title>AI 结构化面试 · 卓品智能招聘助手</title>
  <style>
    #error { color: red; }
    #invalid-page, #consent-step, #phone-step, #done-step { display: none; }
    .actions button { margin-right: 8px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand">卓品智能</span>
      <span class="brand-sub">AI 结构化面试</span>
    </div>
  </header>
  <main class="page" style="max-width:720px">
    <h1 class="page-title">AI 结构化面试</h1>
    <div id="loading" class="loading">加载中…</div>

    <div id="invalid-page">
      <p>链接已失效或已被使用。如需重新获取邀约，请联系 HR。</p>
    </div>

    <div id="consent-step">
      <p>本环节由 AI 主持结构化面试，结果仅供业务经理参考，不作为自动淘汰依据。请分别确认以下两项：</p>
      <div id="terms"></div>
      <div class="actions toolbar">
        <button id="submit-consent-btn" class="btn btn-primary">提交</button>
      </div>
    </div>

    <div id="phone-step">
      <p>请点击下方按钮请求验证码，随后 HR 会通过电话/企微告知您 6 位验证码，收到后填入并提交：</p>
      <div class="actions">
        <button id="request-code-btn" class="btn">请求验证码</button>
      </div>
      <input id="code-input" type="text" inputmode="numeric" maxlength="6" placeholder="6 位验证码">
      <div class="actions">
        <button id="verify-btn" class="btn btn-primary">提交验证码</button>
      </div>
    </div>

    <div id="done-step">
      <p>验证通过，请等待 HR 通知开始面试。</p>
    </div>

    <p id="error"></p>
  </main>

  <script>
    // 条款正文是运营可编辑的 Markdown 文件（config/consent/*.md）。⛔ 不引
    // 第三方渲染库：这里做“先转义、再做最小的段落/列表/加粗/行内码渲染”，
    // 保证任何原文都不会以 HTML 注入，同时不再把 Markdown 源码（#、**）直接
    // 展示给候选人（2026-10-07 1001G UI 审计发现）。
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderMarkdown(text) {
      const lines = String(text).replace(/\r\n/g, "\n").split("\n");
      const out = [];
      let listOpen = false;
      let paragraph = [];
      const inline = (s) =>
        escapeHtml(s)
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/`([^`]+)`/g, "<code>$1</code>");
      const closeList = () => {
        if (listOpen) {
          out.push("</ol>");
          listOpen = false;
        }
      };
      const flushParagraph = () => {
        if (paragraph.length) {
          out.push(`<p>${paragraph.join("<br>")}</p>`);
          paragraph = [];
        }
      };
      for (const rawLine of lines) {
        const line = rawLine.replace(/\s+$/, "");
        const item = line.match(/^\s*\d+\.\s+(.*)$/);
        if (item) {
          flushParagraph();
          if (!listOpen) {
            out.push("<ol>");
            listOpen = true;
          }
          out.push(`<li>${inline(item[1])}</li>`);
          continue;
        }
        if (line.trim() === "") {
          flushParagraph();
          closeList();
          continue;
        }
        // 缩进的续行（如列表项里被折行的长句）并入上一条，不另起段落。
        if (listOpen && /^\s/.test(line)) {
          const last = out.pop();
          out.push(last.replace(/<\/li>$/, ` ${inline(line.trim())}</li>`));
          continue;
        }
        closeList();
        if (/^#{1,6}\s+/.test(line)) {
          flushParagraph();
          out.push(`<h3>${inline(line.replace(/^#{1,6}\s+/, ""))}</h3>`);
        } else {
          paragraph.push(inline(line.trim()));
        }
      }
      flushParagraph();
      closeList();
      return out.join("\n");
    }

    function tokenFromPath() {
      const m = window.location.pathname.match(/\/interview\/([^/]+)\/?$/);
      return m ? m[1] : null;
    }

    const token = tokenFromPath();
    const errorEl = document.getElementById("error");
    let sessionId = null;

    function showError(message) {
      errorEl.textContent = message;
    }

    function showStep(id) {
      ["loading", "invalid-page", "consent-step", "phone-step", "done-step"].forEach((stepId) => {
        document.getElementById(stepId).style.display = stepId === id ? "block" : "none";
      });
    }

    function renderTerms(terms) {
      const container = document.getElementById("terms");
      container.innerHTML = "";
      terms.forEach((term) => {
        const label = term.kind === "ai_interview"
          ? "AI 面试同意（含结果仅供参考、可申请人工面试说明）"
          : "身份核验同意（手机号验证码）";
        const div = document.createElement("div");
        div.className = "term-card";
        div.innerHTML = `
          <h3>${label}（版本 ${escapeHtml(term.version)}）</h3>
          <div class="term-body">${renderMarkdown(term.text)}</div>
          <label class="term-agree"><input type="checkbox" class="consent-checkbox" data-kind="${term.kind}"> 我已阅读并同意</label>
        `;
        container.appendChild(div);
      });
    }

    async function openInvite() {
      const resp = await fetch(`interview/invite/${token}`);
      if (!resp.ok) {
        showStep("invalid-page");
        return;
      }
      const data = await resp.json();
      sessionId = data.session_id;
      renderTerms(data.consent_terms);
      showStep("consent-step");
    }

    document.getElementById("submit-consent-btn").addEventListener("click", async () => {
      showError("");
      const checkboxes = document.querySelectorAll(".consent-checkbox");
      let anyDeclined = false;
      for (const box of checkboxes) {
        const result = box.checked ? "accepted" : "declined";
        if (!box.checked) anyDeclined = true;
        const resp = await fetch(`interview/sessions/${sessionId}/consent`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kind: box.dataset.kind, result }),
        });
        if (!resp.ok) {
          showError("提交同意失败：" + (await resp.text()));
          return;
        }
      }
      if (anyDeclined) {
        showError("您已拒绝其中一项，本次面试已取消。如需人工面试请联系 HR 改约。");
        return;
      }
      showStep("phone-step");
    });

    document.getElementById("request-code-btn").addEventListener("click", async () => {
      showError("");
      const resp = await fetch(`interview/sessions/${sessionId}/verification-code/request`, {
        method: "POST",
      });
      if (!resp.ok) {
        showError("请求验证码失败：" + (await resp.text()));
        return;
      }
      showError("已请求，请联系 HR 获取验证码。");
    });

    document.getElementById("verify-btn").addEventListener("click", async () => {
      showError("");
      const code = document.getElementById("code-input").value.trim();
      const resp = await fetch(`interview/sessions/${sessionId}/verification-code/verify`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code }),
      });
      if (!resp.ok) {
        showError("验证失败：" + (await resp.text()));
        return;
      }
      showStep("done-step");
    });

    if (token) {
      openInvite();
    } else {
      showStep("invalid-page");
    }
  </script>
</body>
</html>
