<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<!--BASE_HREF-->
<title>卓品智能招聘助手 · 内网 Demo</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
  .banner { background: #fff3cd; border: 1px solid #ffe69c; color: #664d03; padding: 12px 16px; border-radius: 8px; margin-bottom: 24px; font-weight: 600; }
  .chat { border: 1px solid #ddd; border-radius: 8px; padding: 16px; min-height: 200px; margin-bottom: 16px; }
  /* pre-wrap：questions_text 兜底分支里是多行文本，不加这条换行会被折叠成一行
     （这是改动前就存在的显示缺陷，本单元按问题逐条渲染后顺带修掉）。 */
  .turn { margin-bottom: 12px; white-space: pre-wrap; }
  .qblock { margin-bottom: 10px; }
  .qblock + .qblock { padding-top: 10px; border-top: 1px dashed #e9ecef; }
  /* 重问的视觉区分（tasks 5.4）：左边框 + 徽标。光靠文本前缀不够——它和
     问题正文同字号同颜色，混在两三条新问题里一眼看不出来。 */
  .qblock.reask { border-left: 3px solid #fd7e14; padding-left: 10px; }
  .reask-badge { display: inline-block; background: #fff3cd; border: 1px solid #ffe69c; color: #664d03; border-radius: 4px; padding: 1px 6px; margin-right: 6px; font-size: 12px; vertical-align: middle; }
  /* 标识文案的样式刻意做得可读而不是"小字免责声明"：《AI 生成合成内容标识
     办法》要的是让人看见，不是让人看不见。 */
  .ai-hint { font-size: 13px; color: #6c757d; margin: 6px 0 6px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #adb5bd; border-radius: 16px; padding: 4px 12px; cursor: pointer; font-size: 14px; }
  .opt input { margin: 0; }
  .turn.done .opt { opacity: 0.45; cursor: default; }
  .turn.user { text-align: right; color: #0d6efd; }
  .turn.assistant { color: #333; }
  textarea { width: 100%; box-sizing: border-box; padding: 8px; }
  button { margin-top: 8px; padding: 8px 16px; cursor: pointer; }
  #jd-output { white-space: pre-wrap; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-top: 16px; display: none; }
  #jd-panel { display: none; margin-top: 16px; }
  #jd-panel #jd-output { display: block; margin-top: 0; }
  .jd-actions { margin-top: 8px; }
  .jd-actions button { margin: 0 8px 0 0; }
  .jd-hint { font-size: 13px; color: #6c757d; margin-left: 4px; }
  #jd-editor { display: none; margin-top: 8px; }
  /* 未溯源提示是**提醒**不是拦截（design 决策 12）：用中性的黄，⛔ 不用
     gap-warning 那套红色——红色会让人以为文案被系统拦下了。 */
  .jd-grounding { background: #fff3cd; border: 1px solid #ffe69c; color: #664d03; padding: 10px 14px; border-radius: 8px; margin-top: 10px; font-size: 14px; }
  /* 人工撰写徽标：AI 标识没了之后，界面上必须还看得出这份文案的作者是谁。 */
  .jd-authorship { font-size: 13px; color: #0f5132; background: #d1e7dd; border: 1px solid #badbcc; border-radius: 6px; padding: 6px 10px; margin-top: 10px; }
  .gap-warning { background: #f8d7da; border: 2px solid #dc3545; color: #58151c; padding: 14px 16px; border-radius: 8px; margin: 16px 0 8px; }
  .gap-warning h3 { margin: 0 0 8px; font-size: 15px; }
  .gap-warning ul { margin: 0 0 10px; padding-left: 20px; }
  .gap-warning .consequence { font-weight: 600; margin-bottom: 12px; }
  .gap-warning button { margin: 0 8px 0 0; }
  .profile-summary { border: 1px solid #0d6efd; border-radius: 8px; padding: 14px 16px; margin: 16px 0 8px; }
  .profile-summary h3 { margin: 0 0 10px; font-size: 15px; }
  .profile-summary dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
  .profile-summary dt { font-weight: 600; color: #495057; }
  .profile-summary dd { margin: 0; white-space: pre-wrap; }
  .approval-actions { margin-top: 8px; }
  .approval-actions button { margin: 0 8px 0 0; }
  #revise-box { display: none; margin-top: 8px; }
</style>
</head>
<body>
  <div class="banner">⚠️ 演示环境，不进入正式招聘流程</div>

  <h1>一句话提用人需求</h1>
  <div class="chat" id="chat"></div>
  <textarea id="input" rows="3" placeholder="例如：要个做嵌入式开发的，能写驱动"></textarea>
  <button id="send-btn">发送</button>
  <div id="profile-summary" class="profile-summary" style="display:none;"></div>
  <div id="gap-warning" class="gap-warning" style="display:none;"></div>
  <div id="approval-actions" class="approval-actions" style="display:none;">
    <button id="confirm-btn" style="display:none;">确认画像，生成 JD</button>
    <button id="revise-btn">我要改一下</button>
    <button id="abandon-btn">放弃这个岗位</button>
  </div>
  <div id="revise-box">
    <textarea id="revise-input" rows="2" placeholder="要改什么？例如：人数改成 3 个，学历放宽到大专"></textarea>
    <button id="revise-submit">提交修改意见</button>
  </div>

  <div id="jd-panel">
    <div id="jd-output"></div>
    <div id="jd-grounding" class="jd-grounding" style="display:none;"></div>
    <div id="jd-authorship" class="jd-authorship" style="display:none;"></div>
    <div class="jd-actions">
      <button id="jd-copy-btn">复制全文</button>
      <button id="jd-edit-btn">编辑文案</button>
      <button id="jd-human-btn">标记为人工撰写</button>
      <span id="jd-copy-hint" class="jd-hint"></span>
    </div>
    <div id="jd-editor">
      <textarea id="jd-editor-input" rows="12"></textarea>
      <button id="jd-save-btn">保存文案</button>
      <button id="jd-cancel-btn">取消</button>
    </div>
  </div>

  <script>
    // 全部请求用相对路径（不带开头的 "/"），配合 <head> 里的 <base href> 解析，
    // 挂在任意前缀下都不需要改这段代码（部署约束1）。
    let jobId = null;
    // 当前这一轮的问题块容器。Task 2 的发送逻辑从这里读勾选结果。
    let activeQuestions = null;

    // 服务端回执里的 jd_text 原文（含 AI 标识）。复制与编辑都从这里取，
    // ⛔ 不从 DOM 的 textContent 反取——那是渲染结果，可能被样式或将来的
    // 截断逻辑改过，而复制出去的东西必须与落库的一字不差（合规红线：
    // AI 生成的 JD 须带标识）。
    let currentJdText = "";

    // 追问要往气泡里塞 DOM 节点（选项控件），不能再只走 textContent。
    // 拆成"建气泡"与"填文本"两步，纯文本的调用点行为逐字不变。
    function appendNode(role) {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      div.className = "turn " + role;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function appendTurn(role, text) {
      appendNode(role).textContent = text;
    }

    // 与后端 app/agents/intake_question.py 的 _REASK_PREFIX 逐字一致。
    // 这是一处刻意的跨语言常量重复（前端无构建、拿不到后端常量），
    // 由 tests/test_static_frontend.py 的 test_reask_prefix_stays_in_sync_with_backend
    // 机械锁死：后端改了这个前缀而这里没跟，测试必然失败。不要就地改字面量。
    const REASK_PREFIX = "（这个你刚才没答）";

    // 《AI 生成合成内容标识办法》（2025-09-01 施行）+ proposal.md「合规影响说明」：
    // 档位是 AI 生成内容，UI 上必须标明是"建议选项"而非既定要求。
    const AI_OPTIONS_HINT = "以下为 AI 建议选项，不是既定要求；可直接点选，也可自行填写";

    // payload.questions 是结构化问题对象数组（question_id / text / field /
    // options / allow_free_text / is_reask）。
    // 兜一层裸字符串：升级前写进 outbox 的历史行里 questions 是字符串数组。
    function questionText(q) {
      return typeof q === "string" ? q : (q && q.text) || "";
    }

    // 三种情况一律返回 []，渲染分支自然退化成今天的纯文本：
    //   1) 历史裸字符串（.51 现网 2026-08-18 之前写的 outbox 行）
    //   2) 单元 B 合并前——模型基本不会主动给档位
    //   3) 目标字段没有可枚举档位（spec:「无法给出有意义选项的问题」）
    // 顺带过滤掉空串与非字符串项：渲染一个没有文字的 chip 比不渲染更糟。
    function questionOptions(q) {
      if (!q || typeof q === "string") return [];
      const options = q.options;
      if (!Array.isArray(options)) return [];
      return options.filter((o) => typeof o === "string" && o.trim() !== "");
    }

    function renderQuestionBlock(container, q) {
      const block = document.createElement("div");
      block.className = "qblock";
      // 拼回复文本时要用问题原文，且不带重问前缀——前缀是系统给用户看的提示，
      // 不该跑进用户这一轮的原话里（会污染第 7 章的来源子串判定）。
      block.dataset.qtext = questionText(q);

      const line = document.createElement("div");
      // 重问的视觉区分（tasks 5.4）：Web 通道用「徽标 + 左边框」，纯文本通道
      // （conversation history、下面那条 questions_text 降级气泡）仍用后端
      // render_questions_text() 拼的内联前缀。两个通道形态不同，**用词是同一
      // 份**——徽标文案逐字取自 REASK_PREFIX，后端改了这个常量而这里没跟，
      // tests/test_static_frontend.py 的强断言会失败。
      // ⛔ 徽标与内联前缀不得并存：并存会让用户看到两遍重问提示。
      if (q && q.is_reask) {
        block.classList.add("reask");
        const badge = document.createElement("span");
        badge.className = "reask-badge";
        badge.textContent = REASK_PREFIX;
        line.appendChild(badge);
      }
      line.appendChild(document.createTextNode(questionText(q)));
      block.appendChild(line);

      const options = questionOptions(q);
      if (options.length > 0) {
        // 标识与选项在同一个分支里创建：不存在"先渲染选项、后补标识"的中间态。
        const hint = document.createElement("div");
        hint.className = "ai-hint";
        hint.textContent = AI_OPTIONS_HINT;
        block.appendChild(hint);

        const group = document.createElement("div");
        group.className = "opts";
        options.forEach((opt) => {
          const label = document.createElement("label");
          label.className = "opt";
          const box = document.createElement("input");
          box.type = "checkbox";
          box.value = opt;
          // ⛔ 绝不把 box 的 checked 属性设为 true。预勾选 = 系统替业务经理做了选择，
          // 用户直接点发送就把 AI 建议写进了画像——正是「候选档位不得代替
          // 用户做决定」这条红线要挡的事。
          // checkbox 而非单选：spec 的「点选即可作答」明确要求"点选了两个
          // 选项并提交"这条路径成立。
          label.appendChild(box);
          label.appendChild(document.createTextNode(opt));
          group.appendChild(label);
        });
        block.appendChild(group);
      }
      // options 为空时到此为止：不渲染空的选项控件，也不渲染孤立的 AI 标识
      // （tasks 4.1 + spec:「界面只渲染自由文本输入，不渲染空的选项控件」）。
      // 自由文本输入是页面上那个常驻的 textarea，任何分支下都在。

      container.appendChild(block);
      return block;
    }

    // 确认入口上方的缺口警示（tasks 6.6/6.7/6.8）。
    // ⛔ 只渲染中文名。历史 confirmation_prompt 行（.51 上 2026-08-25 之前写的）
    // 没有 unspecified_field_labels 这个键，这时渲染条数而不是字段名——绝不回退
    // 去渲染英文 snake_case，那正是本章要修的故障现象。
    const GAP_CONSEQUENCE = "留空的话，这些要求不会出现在生成的 JD 里。";

    // 画像摘要（tasks 6.1）。**这是在修一处现网真实缺陷**：修复前这个分支只渲染
    // 「画像已收集完整，请确认。」加一行未指定字段，从头到尾没有任何代码读画像
    // 内容——业务经理是在看不见画像的情况下点的「确认画像，生成 JD」。
    //
    // ⛔ 全程 textContent + createElement，不拼 HTML 字符串塞进 DOM：画像内容
    // 是 LLM 自由生成的文本。
    // ⛔ 也不从 payload.profile_patch_accumulated 自己拼——那份是英文键名的原始
    // dict，前端一旦读它，界面上迟早会出现英文 snake_case（index.html:162 那条
    // 既有约束）。中文标签值对由后端 summarize_profile() 算好下发。
    const PROFILE_SUMMARY_MISSING_HINT =
      "这条确认记录是旧版本产生的，没有随消息带上画像内容。请在下方输入框补一句话，" +
      "让系统重新整理一遍画像，再确认。";

    function renderProfileSummary(summary) {
      const box = document.getElementById("profile-summary");
      box.textContent = "";

      if (!summary || summary.length === 0) {
        // 历史 confirmation_prompt 行（.51 上 2026-09-04 之前写的）没有
        // profile_summary 这个键，GET /api/jobs/{id} 会把它们原样读回新前端。
        // ⛔ 不静默留白：留白会让业务经理以为"这就是全部内容"，那恰恰是他在
        // 看不见画像的情况下点确认的原样重演。
        const hint = document.createElement("div");
        hint.className = "consequence";
        hint.textContent = PROFILE_SUMMARY_MISSING_HINT;
        box.appendChild(hint);
        box.style.display = "block";
        return;
      }

      const title = document.createElement("h3");
      title.textContent = "这是即将冻结的岗位画像，请逐条核对：";
      box.appendChild(title);

      const list = document.createElement("dl");
      summary.forEach((item) => {
        const dt = document.createElement("dt");
        dt.textContent = item.label;
        const dd = document.createElement("dd");
        dd.textContent = item.value;
        list.appendChild(dt);
        list.appendChild(dd);
      });
      box.appendChild(list);
      box.style.display = "block";
    }

    function hideApprovalUi() {
      ["profile-summary", "gap-warning", "approval-actions", "revise-box"].forEach((id) => {
        document.getElementById(id).style.display = "none";
      });
      document.getElementById("confirm-btn").style.display = "none";
      document.getElementById("jd-panel").style.display = "none";
    }

    function renderGapWarning(fields, labels) {
      const box = document.getElementById("gap-warning");
      const confirmBtn = document.getElementById("confirm-btn");
      box.textContent = "";

      if (!fields || fields.length === 0) {
        // 无缺口不打扰（spec Scenario：无缺口时不出现缺口警示区块）。
        box.style.display = "none";
        confirmBtn.style.display = "inline-block";
        return;
      }

      const title = document.createElement("h3");
      title.textContent = "确认之前请先看一下：还有 " + fields.length + " 项没有确定";
      box.appendChild(title);

      if (labels && labels.length === fields.length) {
        const list = document.createElement("ul");
        labels.forEach((label) => {
          const item = document.createElement("li");
          item.textContent = label;
          list.appendChild(item);
        });
        box.appendChild(list);
      }

      const consequence = document.createElement("div");
      consequence.className = "consequence";
      consequence.textContent = GAP_CONSEQUENCE;
      box.appendChild(consequence);

      // 两个动作都要显式点，没有默认动作、没有预选（合规红线：AI 不代替人做决定）。
      const backBtn = document.createElement("button");
      backBtn.textContent = "回去补答";
      backBtn.addEventListener("click", () => {
        // 6.8：回到可继续作答的状态。已采集内容留在服务端，前端只需把入口交还
        // 给输入框——用户下一条回复照常走 POST /reply。
        box.style.display = "none";
        confirmBtn.style.display = "none";
        document.getElementById("profile-summary").style.display = "none";
        document.getElementById("approval-actions").style.display = "none";
        appendTurn("assistant", "好的，请直接补充上面这几项，我接着记。");
        document.getElementById("input").focus();
      });
      box.appendChild(backBtn);

      const anywayBtn = document.createElement("button");
      anywayBtn.textContent = "知道有缺口，仍然确认";
      anywayBtn.addEventListener("click", () => doConfirm(true));
      box.appendChild(anywayBtn);

      box.style.display = "block";
      // 有缺口时主确认按钮不出现：UI 层就没有"不做选择直接确认"这条路可走。
      confirmBtn.style.display = "none";
    }

    function renderMessage(message) {
      if (message.type === "question") {
        const questions = message.payload.questions || [];
        if (questions.length === 0) {
          // 极端降级：payload 里连问题数组都没有时退回整段文本。
          // 注意这里**不保证**非空气泡——questions: [] 且 questions_text: ""
          // 时（零产出轮，app/graph/build.py 今天就会发出这种 payload）
          // appendTurn 拿到的是空字符串，渲染出来就是一个空白气泡。这不是
          // 本单元引入的行为，改动前就是如此；给空气泡兜底文案属于零产出轮
          // 的处理范围，由交付单元 B 负责（tasks 3.9-3.11），这里不动。
          appendTurn("assistant", message.payload.questions_text || "");
          activeQuestions = null;
        } else {
          const turn = appendNode("assistant");
          questions.forEach((q) => renderQuestionBlock(turn, q));
          // 记住"本轮"的问题块。只有它里面的勾选会被 Task 2 的发送逻辑读取——
          // 上一轮的块在提交后置灰，否则用户点了两轮之前的档位，拼出来的
          // 回复文本会对不上当前问题。
          activeQuestions = turn;
        }
        hideApprovalUi();
      } else if (message.type === "confirmation_prompt") {
        appendTurn("assistant", "画像已收集完整，请逐条核对后确认。");
        renderProfileSummary(message.payload.profile_summary);
        renderGapWarning(
          message.payload.unspecified_fields || [],
          message.payload.unspecified_field_labels || []
        );
        // 三个操作始终一起出现（spec：确认/修改/放弃）。⛔ 有缺口时也不能只留
        // 确认一条路——renderGapWarning 只管收起「确认」按钮，"修改"和"放弃"
        // 任何时候都在，否则业务经理会被卡在一个没有出口的页面上。
        document.getElementById("approval-actions").style.display = "block";
        document.getElementById("revise-box").style.display = "none";
      }
    }

    // 把本轮点选拼成该轮回复文本。**刻意不改 API 契约**（delivery-units.md
    // §5 约定 2）：POST 出去的仍然只有 {message}，被选中的档位以逐字原文出现在
    // 用户这一轮的原话里。给 ReplyRequest 加 selected_options 会碰到
    // app/web/server.py，单元 C 与并行进行的单元 B/D 立刻从并行变串行。
    //
    // 附带好处：档位文本逐字出现在用户原话里，第 7 章 7.3 的来源子串判定天然
    // 命中，7.4 的“点选来源例外”大概率不必单独实现。
    function collectSelections() {
      if (!activeQuestions) return [];
      const lines = [];
      activeQuestions.querySelectorAll(".qblock").forEach((block) => {
        const picked = Array.from(block.querySelectorAll("input[type=checkbox]"))
          .filter((box) => box.checked)
          .map((box) => box.value);
        if (picked.length > 0) {
          // 带上问题原文：一轮问 2-3 个问题时，光丢回一个 "ASIL-D" 模型不知道
          // 在答哪一条。这个选择的代价（问题文本自身逐字含某个档位值时，会让
          // 该值即使未被勾选也出现在用户原话里，污染第 7 章的子串判定）已写进
          // 本计划的「给单元 F 的接口说明」，由 F 决定是否收窄搜索范围。
          lines.push(block.dataset.qtext + "：" + picked.join("、"));
        }
      });
      return lines;
    }

    // 提交后置灰上一轮的选项：再点一次拼出来的文本会对不上当前问题，
    // 而用户看不出这个错位——他只会觉得“我明明选了，系统怎么答非所问”。
    // done 这个类挂在 assistant 气泡（.turn）上，对应样式 .turn.done .opt。
    function freezeActiveQuestions() {
      if (!activeQuestions) return;
      activeQuestions.classList.add("done");
      activeQuestions.querySelectorAll("input[type=checkbox]").forEach((box) => {
        box.disabled = true;
      });
      activeQuestions = null;
    }

    document.getElementById("send-btn").addEventListener("click", async () => {
      const input = document.getElementById("input");
      const typed = input.value.trim();
      // 三条路径都要成立（spec 的三条 Scenario）：
      //   点选、一个字没打        → 能提交（「点选即可作答」）
      //   只打字、一个都没点      → 能提交，不因“未点选”被拒（「选项之外的答案」）
      //   既没点也没打            → 什么都不做，与改动前 if (!text) return 一致
      // 用户**不需要**复制粘贴或改写系统给出的问题文本才能回答——这是三份
      // pilot 反馈里业务经理原话抱怨的那一点（tasks 4.2）。
      const parts = collectSelections();
      if (typed) parts.push(typed);
      const message = parts.join("\n");
      if (!message) return;

      input.value = "";
      freezeActiveQuestions();
      // 聊天区显示的，就是实际发出去的那一段文本，一字不差——用户要能核对
      // 系统替他拼了什么。
      appendTurn("user", message);

      const url = jobId ? `api/jobs/${jobId}/reply` : "api/jobs";
      const resp = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        // 请求体逐字不变：{message: "..."}。这是 B ∥ C 并行成立的全部前提。
        body: JSON.stringify({ message: message }),
      });
      const data = await resp.json();
      if (!jobId) jobId = data.job_id;
      renderMessage(data.message);
    });

    // ── JD 面板（tasks 7.3 / 7.5 / 7.7）────────────────────────────────
    //
    // ⛔ 这一段里**没有**任何拼接或剥离 AI 标识的代码，而且不许有：标识由服务端
    // 贴、由服务端在「标记为人工撰写」时去掉并留痕。前端自己动手就等于开了一条
    // 不留痕的去标识路径（合规红线：《AI 生成合成内容标识办法》）。

    function renderJd(data) {
      currentJdText = data.jd_text || "";
      document.getElementById("jd-panel").style.display = "block";
      document.getElementById("jd-output").textContent = currentJdText;
      document.getElementById("jd-copy-hint").textContent = "";

      // 未溯源术语只提示，⛔ 不禁用任何按钮、不挡任何操作（design 决策 12：
      // 本批只观测不拦截）。这是给 HR 的一句"这几个词画像里没有，核对一下"。
      const grounding = document.getElementById("jd-grounding");
      const terms = data.ungrounded_terms || [];
      if (terms.length) {
        grounding.textContent =
          "以下技术要求在岗位画像里找不到出处，发布前请核对：" + terms.join("、");
        grounding.style.display = "block";
      } else {
        grounding.style.display = "none";
      }

      // 标识去掉之后，界面上仍然要看得出这份文案是谁声明为人工撰写的。
      const authorship = document.getElementById("jd-authorship");
      const humanBtn = document.getElementById("jd-human-btn");
      if (data.human_written && data.authorship) {
        authorship.textContent =
          "已标记为人工撰写：" + data.authorship.marked_by + "，" + data.authorship.at;
        authorship.style.display = "block";
        humanBtn.style.display = "none";
      } else {
        authorship.style.display = "none";
        humanBtn.style.display = "inline-block";
      }
    }

    async function copyJdText() {
      const hint = document.getElementById("jd-copy-hint");
      const text = currentJdText;
      if (!text) {
        hint.textContent = "还没有可复制的文案。";
        return;
      }

      let ok = false;
      // 现代 API 只在安全上下文（https 或 localhost）里存在。
      if (window.isSecureContext && navigator.clipboard) {
        try {
          await navigator.clipboard.writeText(text);
          ok = true;
        } catch (err) {
          ok = false;
        }
      }
      if (!ok) {
        // ⚠️ 这条兜底不是装饰：demo 挂在明文 http://…:8095 上，那里
        // navigator.clipboard **根本不存在**（undefined，不抛异常），
        // 只写上面那半段的话，复制按钮在服务器上会一声不响地什么都不做。
        const scratch = document.createElement("textarea");
        scratch.value = text;
        scratch.setAttribute("readonly", "");
        scratch.style.position = "fixed";
        scratch.style.top = "-1000px";
        document.body.appendChild(scratch);
        scratch.select();
        try {
          ok = document.execCommand("copy");
        } catch (err) {
          ok = false;
        }
        document.body.removeChild(scratch);
      }
      hint.textContent = ok
        ? "已复制纯文本全文（含 AI 生成标识）"
        : "复制失败，请手动选中下方文案复制";
    }

    async function submitJd(url, init) {
      const resp = await fetch(url, init);
      const data = await resp.json();
      if (!resp.ok) {
        const detail = data && data.detail;
        appendTurn(
          "assistant",
          "⚠️ " + (typeof detail === "string" ? detail : "操作失败，请稍后重试。")
        );
        return null;
      }
      renderJd(data);
      return data;
    }

    document.getElementById("jd-copy-btn").addEventListener("click", copyJdText);

    document.getElementById("jd-edit-btn").addEventListener("click", () => {
      document.getElementById("jd-editor-input").value = currentJdText;
      document.getElementById("jd-editor").style.display = "block";
      document.getElementById("jd-editor-input").focus();
    });

    document.getElementById("jd-cancel-btn").addEventListener("click", () => {
      document.getElementById("jd-editor").style.display = "none";
    });

    document.getElementById("jd-save-btn").addEventListener("click", async () => {
      const text = document.getElementById("jd-editor-input").value.trim();
      if (text.length === 0) return;
      const data = await submitJd(`api/jobs/${jobId}/jd`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text }),
      });
      if (data) {
        document.getElementById("jd-editor").style.display = "none";
      }
    });

    document.getElementById("jd-human-btn").addEventListener("click", async () => {
      // 去掉 AI 生成标识是一次不可撤销的合规声明，二次确认不是多余的一步。
      // ⛔ 不做成"点一下就去掉"。
      if (
        !window.confirm(
          "标记为人工撰写会去掉文案里的 AI 生成标识，并记下是谁、什么时候标记的。" +
            "只有在你已经大幅改写过这份文案时才这样做。确定吗？"
        )
      ) {
        return;
      }
      await submitJd(`api/jobs/${jobId}/jd/human-written`, { method: "POST" });
    });

    async function doConfirm(acknowledged) {
      // 无缺口时发的仍然是不带 body 的 POST，与改动前逐字一致——6.10 要求
      // "无缺口时确认流程与今天完全一致，不多一步点击"。
      const init = acknowledged
        ? {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ acknowledged_gaps: true }),
          }
        : { method: "POST" };
      const resp = await fetch(`api/jobs/${jobId}/confirm`, init);
      const data = await resp.json();
      // 确认这一步可能因为画像字段不合规被拒（422，例如模型把 headcount 写成
      // "两个人"），也可能因为还没到可确认状态被拒（409）。不处理的话下面会把
      // undefined 塞进 JD 面板，用户看到的是一片空白、不知道发生了什么。
      if (!resp.ok) {
        const detail = data && data.detail;
        let reason = "确认失败，请稍后重试。";
        if (typeof detail === "string") {
          reason = detail;
        } else if (detail && detail.gaps) {
          // 409 的缺口回执同样只显示中文名。
          reason = [detail.message]
            .concat(detail.gaps.map((gap) => gap.label))
            .join("；");
        } else if (detail) {
          const fields = (detail.errors || []).map(
            (e) => `${e.field}: ${e.reason}（当前值 ${e.got}）`
          );
          reason = [detail.message].concat(fields).join("；");
        }
        appendTurn("assistant", "⚠️ " + reason);
        return;
      }
      document.getElementById("gap-warning").style.display = "none";
      renderJd(data);
      if (data.needs_manual) {
        appendTurn("assistant", "⚠️ JD 多次触发歧视性表述检测，已转人工处理，请核对下方内容。");
      }
    }

    // ── 修改分支（tasks 6.5 / 6.6）──────────────────────────────────────
    document.getElementById("revise-btn").addEventListener("click", () => {
      const box = document.getElementById("revise-box");
      box.style.display = "block";
      document.getElementById("revise-input").focus();
    });

    document.getElementById("revise-submit").addEventListener("click", async () => {
      const input = document.getElementById("revise-input");
      const feedback = input.value.trim();
      if (!feedback) return;

      appendTurn("user", feedback);
      input.value = "";
      hideApprovalUi();

      const resp = await fetch(`api/jobs/${jobId}/revise`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ feedback: feedback }),
      });
      const data = await resp.json();
      if (!resp.ok) {
        // 409 超限时 detail 是对象（带 revision_count / max_revisions），
        // 422 空意见时 detail 是字符串。两种都要说人话。
        const detail = data && data.detail;
        const reason =
          typeof detail === "string"
            ? detail
            : (detail && detail.message) || "修改提交失败，请稍后重试。";
        appendTurn("assistant", "⚠️ " + reason);
        // 超限之后**确认那条路仍然开着**（spec：由 HR 直接编辑画像后提交确认），
        // 所以把确认区放回来，⛔ 不要把人锁死在一个没有出口的页面上。
        document.getElementById("approval-actions").style.display = "block";
        return;
      }
      renderMessage(data.message);
    });

    // ── 放弃分支（tasks 6.7）────────────────────────────────────────────
    document.getElementById("abandon-btn").addEventListener("click", async () => {
      // 放弃是终态且不可撤销，二次确认不是多余的一步。⛔ 不做成"点一下就放弃"。
      if (!window.confirm("放弃后这个岗位不再流转（内容会保留）。确定放弃吗？")) return;

      const resp = await fetch(`api/jobs/${jobId}/abandon`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ reason: "" }),
      });
      const data = await resp.json();
      if (!resp.ok) {
        const detail = data && data.detail;
        appendTurn("assistant", "⚠️ " + (typeof detail === "string" ? detail : "放弃失败，请稍后重试。"));
        return;
      }
      hideApprovalUi();
      appendTurn("assistant", "已放弃这个岗位。已采集的内容保留在系统里，可供事后查阅。");
      document.getElementById("send-btn").disabled = true;
      document.getElementById("input").disabled = true;
    });

    document.getElementById("confirm-btn").addEventListener("click", () => doConfirm(false));
  </script>
</body>
</html>
