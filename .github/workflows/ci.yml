name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# windows-latest runner 的 Python stdout/stderr 默认编码是 cp1252（legacy 代码页），
# 本项目代码与文档大量中文——姊妹项目 zhuopin-ai-transformation 的 CI 首次上线时
# 就因为这个在 windows-latest 上被 print 中文/emoji 直接 UnicodeEncodeError 打挂
# （'charmap' codec can't encode character...）。这里的 test job 同样跑在
# windows-latest，提前设对，不等真的炸了再修。
env:
  PYTHONUTF8: "1"

jobs:
  # 跑在 windows-latest 而不是 ubuntu，理由跟把 Python 收紧到 3.14 是同一个：
  # 测试环境要等于运行环境（.51 是 Windows + Py3.14，无 Docker）。
  # 这个项目踩过的坑——BOM、GBK 代码页、CRLF、路径分隔符——在 Ubuntu 上一个都不会现形。
  # 代价是 Windows runner 按 2 倍计费；81 个用例约 2 分钟，私有库免费额度够用。
  test:
    name: 测试 · Windows · Python 3.14
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 版本留痕（排查版本偏斜时要看这一段）
        run: |
          python --version
          python -c "import sqlite3; print('sqlite3 library:', sqlite3.sqlite_version); print('sqlite3 module:', sqlite3.version)"
          pip list

      - name: pytest
        run: python -m pytest -q

      # 合规红线的可归因门禁。三条断言 + 链校验 + 对账已经在上一步的全量里
      # 跑过一遍了，这里**故意再跑一遍**：红线被破坏时，CI 页面上要能看见一个
      # 名字就叫「合规断言」的红色步骤，而不是让人从几百条用例里翻。
      #
      # ⚠️ 这些断言在 CI 的空库上**恒真**。CI 的效力不来自它们返回绿色，来自
      # tests/test_audit_assertion_effectiveness.py 里那 22 条"造违例 → 必须
      # 失败"的反证（tasks.md 6.7）。⛔ 不要把反证从这个标记里摘出去。
      #
      # 真实数据上的巡检在 .51 上手工跑：
      #   python -m app.audit.assertions --db data/demo.db --mirror data/audit/decisions.jsonl
      # 口径见 docs/audit-and-outbound-ops.md。
      - name: 合规断言（红线守护）
        run: python -m pytest -q -m compliance -v

  # 跟本地 pre-commit 用同一份 .pre-commit-config.yaml —— 单一真源。
  # 本地钩子能被 `git commit --no-verify` 绕过，这一层绕不过去。
  hooks:
    name: 防泄露与文件检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: 装 pre-commit
        run: pip install pre-commit

      - name: 全仓库跑一遍钩子
        run: pre-commit run --all-files --show-diff-on-failure

      # 本包三条硬边界（delivery-units.md §4 约定 7）的机器化：不新增
      # zhuopin_platform 依赖、不跨仓库 import、不拷贝参考文件。
      # 挂在 hooks job 而不是 test job，两个理由：
      #   ① 这个 job 的 checkout 已经是 fetch-depth: 0 —— 7.2 的依赖 diff
      #      要按变更包立项 commit e65f685 比，浅克隆取不到那个 object，
      #      会以 `fatal: bad object` 失败；
      #   ② ⛔ 不动 test job 的 pytest / 合规断言两个步骤（U6 刚定型）。
      #
      # ⚠️ 这一步在健康的仓库里恒绿。它的效力不来自绿色，来自
      # tests/test_boundary_guard.py 里那些"造违例 → 必须失败"的反证。
      # ⛔ 不要把反证删掉只留这一步。
      - name: 边界守护（禁止 zhuopin_platform 与跨仓库注入）
        run: python scripts/check_boundary.py

  # 需求契约的机器门禁。CLI 版本与本地全局安装的一致（@fission-ai/openspec@1.9.0），
  # 不用 latest —— 校验规则漂移会让「昨天绿今天红」变成无从解释的事。
  #
  # 暂设 continue-on-error：这条 job 从未在 CI 里跑过，先观察一轮它对现有变更包
  # （m1-job-profile-intake，tasks 还差 0.11 未勾完）的实际判定，确认不是噪音再改成阻断。
  openspec:
    name: 需求契约校验（观察期·不阻断）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 逐个校验未归档变更包
        run: |
          shopt -s nullglob
          failed=0
          found=0
          for d in openspec/changes/*/; do
            name="$(basename "$d")"
            [ "$name" = "archive" ] && continue
            found=1
            echo "── $name"
            npx --yes @fission-ai/openspec@1.9.0 validate "$name" --strict || failed=1
          done
          if [ "$found" -eq 0 ]; then
            echo "没有未归档的变更包，跳过"
          fi
          exit "$failed"
