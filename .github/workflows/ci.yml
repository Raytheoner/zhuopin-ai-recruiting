name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 跑在 windows-latest 而不是 ubuntu，理由跟把 Python 收紧到 3.14 是同一个：
  # 测试环境要等于运行环境（.51 是 Windows + Py3.14，无 Docker）。
  # 这个项目踩过的坑——BOM、GBK 代码页、CRLF、路径分隔符——在 Ubuntu 上一个都不会现形。
  # 代价是 Windows runner 按 2 倍计费；81 个用例约 2 分钟，私有库免费额度够用。
  test:
    name: 测试 · Windows · Python 3.14
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 版本留痕（排查版本偏斜时要看这一段）
        run: |
          python --version
          pip list

      - name: pytest
        run: python -m pytest -q

  # 跟本地 pre-commit 用同一份 .pre-commit-config.yaml —— 单一真源。
  # 本地钩子能被 `git commit --no-verify` 绕过，这一层绕不过去。
  hooks:
    name: 防泄露与文件检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: 装 pre-commit
        run: pip install pre-commit

      - name: 全仓库跑一遍钩子
        run: pre-commit run --all-files --show-diff-on-failure

  # 需求契约的机器门禁。CLI 版本与本地全局安装的一致（@fission-ai/openspec@1.8.0），
  # 不用 latest —— 校验规则漂移会让「昨天绿今天红」变成无从解释的事。
  #
  # 暂设 continue-on-error：这条 job 从未在 CI 里跑过，先观察一轮它对现有变更包
  # （m1-job-profile-intake，tasks 还差 0.11 未勾完）的实际判定，确认不是噪音再改成阻断。
  openspec:
    name: 需求契约校验（观察期·不阻断）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 逐个校验未归档变更包
        run: |
          shopt -s nullglob
          failed=0
          found=0
          for d in openspec/changes/*/; do
            name="$(basename "$d")"
            [ "$name" = "archive" ] && continue
            found=1
            echo "── $name"
            npx --yes @fission-ai/openspec@1.8.0 validate "$name" --strict || failed=1
          done
          if [ "$found" -eq 0 ]; then
            echo "没有未归档的变更包，跳过"
          fi
          exit "$failed"
