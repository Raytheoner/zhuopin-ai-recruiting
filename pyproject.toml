[project]
name = "zhuopin-recruiting-agent"
version = "0.1.0-demo"
# 与部署目标（.51 服务器，Windows，Python 3.14）严格对齐。
# 收紧到单一版本区间是刻意的：测试环境 = 运行环境，否则「本地 81 全绿」证明不了服务器行为。
# pydantic 被迫从 2.10.4 升到 2.13.4 就是版本偏斜的第一个症状。
requires-python = ">=3.14,<3.15"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# 合规断言（U6）。CI 在跑完全量之后**再单独跑一遍**打了这个标记的用例，
# 让「红线被破坏」变成一个可归因的失败步骤，而不是埋在几百条用例里的一行红。
# 重复执行是刻意的成本，⛔ 不要为了省几秒把全量那次改成 -m "not compliance"。
markers = [
    "compliance: 合规红线断言与其反证（tasks.md 第 6 章）",
]
